name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Sync Integrity
        run: pnpm check-sync

      - name: Validate All Content
        run: pnpm validate-all
        env:
          CHECK_PLACEHOLDERS: '0'

      - name: Test and Typecheck Each Project
        run: |
          pnpm each "pnpm install --frozen-lockfile"
          pnpm each "pnpm test"
          pnpm each "pnpm validate"

      - name: Test and Build Sites Admin
        run: |
          cd sites-admin
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Verify Standalone Isolation
        run: pnpm verify-standalone
