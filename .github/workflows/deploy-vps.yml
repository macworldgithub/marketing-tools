name: Deploy Changed Sites to VPS

on:
  push:
    branches: [main]

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches current and previous commit to detect diffs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Detect Changed Sites
        id: changes
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            try {
              const diff = execSync('git diff --name-only HEAD~1 HEAD', { encoding: 'utf-8' });
              const files = diff.split('\n').map(s => s.trim()).filter(Boolean);
              const changed = new Set();
              for (const f of files) {
                const parts = f.split(/[\\\/]/);
                if (parts.length >= 2 && ['content', 'app', 'src'].includes(parts[1])) {
                  changed.add(parts[0]);
                }
              }
              const sites = Array.from(changed).join(' ');
              console.log('Detected changed sites:', sites);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sites=' + sites + '\n');
            } catch (err) {
              console.log('Error detecting diff:', err.message);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sites=\n');
            }
          "

      - name: Check VPS Configuration
        id: vps_check
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Notice: VPS_HOST or VPS_SSH_KEY secrets are not configured in GitHub repository secrets."
            echo "Skipping VPS deployment. Once you add VPS_HOST, VPS_SSH_KEY, and VPS_USER secrets, deployments will run automatically."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and Sync Changed Sites to VPS
        if: steps.changes.outputs.sites != '' && steps.vps_check.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          for SLUG in ${{ steps.changes.outputs.sites }}; do
            if [ -d "$SLUG" ] && [ -f "$SLUG/package.json" ]; then
              echo "----------------------------------------"
              echo "Building: $SLUG"
              echo "----------------------------------------"
              cd "$SLUG"
              pnpm install --frozen-lockfile
              pnpm build

              echo "Deploying $SLUG to $VPS_USER@$VPS_HOST:/var/www/$SLUG/ ..."
              ssh $VPS_USER@$VPS_HOST "mkdir -p /var/www/$SLUG"
              rsync -avz --delete out/ $VPS_USER@$VPS_HOST:/var/www/$SLUG/
              cd ..
              echo "Successfully deployed $SLUG to VPS!"
            fi
          done

